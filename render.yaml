# Render Blueprint: https://dashboard.render.com/blueprints
# New > Blueprint > connect FaiziNerd/HackScout > Deploy Blueprint
# Then set sync:false env vars in the worker service dashboard.

services:
  - type: worker
    name: hackscout-scrapers
    runtime: node
    plan: starter
    repo: https://github.com/FaiziNerd/HackScout.git
    branch: main
    buildCommand: npm ci && npx prisma generate
    startCommand: npm run worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: NEXT_PUBLIC_SITE_URL
        value: https://hack-scout-delta.vercel.app
